name: embedded-quality-validation

on:
  push:
  pull_request:

jobs:
  validation:
    name: python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"
      - name: Repository health check
        run: python scripts/check_repo_health.py
      - name: Formatting and lint gate
        run: ruff check .
      - name: Smoke validation runner
        run: python main.py smoke --output artifacts/smoke_report.json
      - name: Pytest validation suite
        run: pytest --cov=eqv --cov-report=xml --cov-report=term-missing
      - name: Release quality gate
        run: python scripts/run_quality_gate.py
      - name: Triage report
        if: always()
        run: python scripts/triage_report.py
      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-artifacts-${{ matrix.python-version }}
          path: |
            artifacts/
            coverage.xml
