[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embedded-quality-validation-showcase"
version = "0.3.0"
description = "Python validation framework showcase for cloud-connected embedded home-energy devices."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Ehsan Ghorbani"}]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
]
serial = ["pyserial>=3.5"]

[project.scripts]
eqv = "eqv.cli:main"

[tool.pytest.ini_options]
addopts = "-q --tb=short --strict-markers --junitxml=artifacts/junit.xml"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "hil: tests that require hardware-in-the-loop or a simulator",
  "regression: tests created from field telemetry/failure logs",
  "cloud: device-to-cloud interaction tests",
  "release_gate: tests that block release decisions",
  "memory: RAM/NVM/EEPROM diagnostic validation tests",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "B", "BLE", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
